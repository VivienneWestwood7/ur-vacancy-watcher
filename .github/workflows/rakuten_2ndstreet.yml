name: セカンドストリート新着監視

on:
  schedule:
    # 10分ごとに起動します(GitHubの混雑状況により数分遅れることがあります)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# 前回の実行がまだ終わっていない場合は、次の実行を順番待ちさせる
# (state.jsonへの同時書き込みによる競合を防ぐため)
concurrency:
  group: rakuten-2ndstreet-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r rakuten_2ndstreet/requirements.txt

      - name: 新着チェックを実行
        env:
          # 専用の通知先がなければ、UR監視と同じWebhookを使う
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_2NDSTREET || secrets.DISCORD_WEBHOOK_URL }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
        run: python rakuten_2ndstreet/check_2ndstreet.py

      - name: 状態ファイルの変更をコミット
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rakuten_2ndstreet/state.json

          if git diff --staged --quiet; then
            echo "状態に変化なし。コミットをスキップします。"
            exit 0
          fi

          git commit -m "セカンドストリート通知状態を更新 [skip ci]"

          # UR監視の実行などと競合してpushが拒否された場合に備えて、
          # 最新のリモートを取り込んでから数回リトライする
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushに成功しました"
              exit 0
            fi
            echo "pushが競合しました。リトライします... (${i}回目)"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "rebaseに失敗しました(state.jsonの内容が競合しています)"
              git rebase --abort
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 5 ))
          done

          echo "pushに複数回失敗しました"
          exit 1
